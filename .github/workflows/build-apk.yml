name: Build Jules Mobile APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Jules Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jules-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Keystore & Build Signed Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: "jules-mobile-release.jks"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > jules-mobile-release.jks
          ./gradlew assembleRelease

      - name: Upload Signed Release APK Artifact
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jules-mobile-release-apk
          path: app/build/outputs/apk/release/
